name: Revion CI & Verification

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint, Test & Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck & Build
        run: npm run compile

      - name: Run Linter
        run: npm run lint

      - name: Run Automated Test Suite (Vitest)
        run: npm test

      - name: Package VSIX Extension (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run package

      - name: Upload Production VSIX Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: revion-extension-vsix
          path: '*.vsix'
          if-no-files-found: error
